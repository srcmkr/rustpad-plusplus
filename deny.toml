# cargo-deny: known vulnerabilities, licenses and crate sources.
# CI runs `cargo deny check`; run it locally after changing dependencies.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained crates that come in through GPUI and have no maintained
# replacement yet. Not vulnerabilities; drop an entry once it is gone.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste, via gpui-ce (pulp)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via gpui-ce" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via gpui-ce (zbus, accessibility)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via gpui-ce (zbus, accessibility)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via gpui-ce (zbus, accessibility)" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# GPUI pulls in several versions of some crates; worth a look, not a failure.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
