[workspace]
resolver = "3"
members = [".", "crates/*"]
exclude = [
    "patches/xim-ctext",
    "patches/fontique",
    "patches/gpui-ce",
    "patches/gpui_ce_linux",
    "patches/gpui_ce_parley",
    "patches/gpui_ce_wgpu",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["srcmkr"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/srcmkr/rustpad-plusplus"
rust-version = "1.95"

[package]
name = "rustpad"
description = "A fast text editor for files of any size"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not on crates.io; also lets cargo-deny accept the path dependency.
publish = false

[dependencies]
anyhow = "1.0.104"
rustpad-update = { path = "crates/rustpad-update" }
async-channel = "2"
encoding_rs = "0.8"
gpui = { package = "gpui-ce", version = "0.3" }
gpui_platform = { package = "gpui_ce_platform", version = "0.3" }
memchr = "2.8.3"
# Find ignoring case; only the parts that needs.
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode-case"] }
memmap2 = "0.9.11"
pulldown-cmark = { version = "0.13.4", default-features = false }
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = "0.13"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
debug = false
strip = true

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# Fixed COMPOUND_TEXT decoding: umlauts typed through ibus/XIM crashed the app.
xim-ctext = { path = "patches/xim-ctext" }
# A window on screen within a few dozen milliseconds: the first X11 window draws on the CPU
# (with the renderer's own shader code) while its GPU device is created on another thread,
# the system fonts are collected and prepared in the background, and fontique finds a
# generic font family only when it is first used.
gpui-ce = { path = "patches/gpui-ce" }
gpui_ce_linux = { path = "patches/gpui_ce_linux" }
gpui_ce_parley = { path = "patches/gpui_ce_parley" }
gpui_ce_wgpu = { path = "patches/gpui_ce_wgpu" }
fontique = { path = "patches/fontique" }
