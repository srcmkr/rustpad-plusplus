[workspace]
resolver = "3"
members = [".", "crates/*"]
exclude = ["patches/xim-ctext"]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["srcmkr"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/srcmkr/rustpad-plusplus"
rust-version = "1.90"

[package]
name = "rustpad"
description = "A fast text editor for files of any size"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
rustpad-update = { path = "crates/rustpad-update" }
async-channel = "2"
encoding_rs = "0.8"
gpui = "0.2.2"
memchr = "2.8.3"
memmap2 = "0.9.11"
pulldown-cmark = { version = "0.13.4", default-features = false }
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = "0.13"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
debug = false
strip = true

[profile.dev.package."*"]
opt-level = 2

# Fixed COMPOUND_TEXT decoding: umlauts typed through ibus/XIM crashed the app.
[patch.crates-io]
xim-ctext = { path = "patches/xim-ctext" }
