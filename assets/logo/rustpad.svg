<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>rustpad++</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F77B45"/>
      <stop offset="1" stop-color="#B9380F"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FCEFE7"/>
    </linearGradient>
    <linearGradient id="plus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0602A"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>
  <!-- page shadow -->
  <path d="M66 46 H166 L210 90 V218 A14 14 0 0 1 196 232 H66 A14 14 0 0 1 52 218 V60 A14 14 0 0 1 66 46 Z" fill="#7A2208" opacity=".22"/>
  <!-- page -->
  <path d="M62 36 H164 L204 76 V206 A14 14 0 0 1 190 220 H62 A14 14 0 0 1 48 206 V50 A14 14 0 0 1 62 36 Z" fill="url(#page)"/>
  <!-- folded corner -->
  <path d="M164 36 L204 76 H178 A14 14 0 0 1 164 62 Z" fill="#F4B898"/>
  <!-- text lines -->
  <g stroke="#2B2D30" stroke-width="13" stroke-linecap="round">
    <line x1="76" y1="74" x2="140" y2="74"/>
    <line x1="76" y1="104" x2="120" y2="104" stroke-opacity=".45"/>
  </g>
  <!-- ++ -->
  <g stroke="url(#plus)" stroke-width="17" stroke-linecap="round">
    <path d="M70 160 H110 M90 140 V180"/>
    <path d="M142 160 H182 M162 140 V180"/>
  </g>
</svg>
